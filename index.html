<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полная карта состояний</title>
<style>
:root{--bg:#faf8f5;--ink:#2b2620;--accent:#b0764a;--line:#e6ded4;--red:#c05252}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:24px 16px;max-width:640px;margin:0 auto}
h1{font-size:1.4rem;margin-bottom:8px}
.muted{color:#8a8078;font-size:.9rem}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin:16px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.bar{height:8px;background:#eee;border-radius:4px;margin:8px 0 20px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}
textarea,input[type=range]{width:100%;font:inherit}
textarea{min-height:110px;padding:10px;border:1px solid var(--line);border-radius:10px}
.slider{margin:14px 0}.slider label{display:block;margin-bottom:4px}
.hm{display:flex;align-items:center;gap:10px;margin:6px 0}
.hm .name{width:96px;flex:none}
.hm .fill{flex:1;height:14px;border-radius:7px;background:#eee;position:relative}
.hm .fill>i{position:absolute;top:0;bottom:0;left:0;border-radius:7px}
.hm .val{width:34px;text-align:right;font-size:.85rem;color:#8a8078}
.btn{display:inline-block;background:var(--ink);color:#fff;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer;margin:12px 8px 0 0}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.note{font-size:.85rem;color:#8a8078;margin-top:6px}
.warn{color:var(--red)}
.redscreen{background:#fff5f5;border:1px solid #d98a8a}
.meta{color:#8a8078;font-size:.8rem;margin:4px 0}
</style>
</head>

    {"id":24,"text":"Мечта, на которую вы шли, сорвалась. Что внутри?","options":[
      {"t":"Всё, на что я шёл, рухнуло — и это бьёт наотмашь","ch":"Чувство"},
      {"t":"Сразу строю новый план: в следующей попытке возьму больше","ch":"Импульс"},
      {"t":"Нужен человек, с которым можно это прожить вслух","ch":"Слова"},
      {"t":"Беру в руки что-то простое и реальное — так выравниваюсь","ch":"Опора"}]}
  ],
  "block_b": [
    {"id":1,"text":"Вспомните последнее состояние, когда вы сорвались или почти сорвались. Что происходило за час до этого?"},
    {"id":2,"text":"Что вам говорят о вас близкие чаще всего — и приятного, и неприятного?"},
    {"id":3,"text":"Что вы делаете, когда вам плохо? Опишите последние три раза."},
    {"id":4,"text":"Опишите день, который прошёл «как у вас обычно бывает». Что в нём самое узнаваемое?"},
    {"id":5,"text":"Что вы откладываете прямо сейчас — и что мешает начать?"},
    {"id":6,"text":"Какой момент за последний месяц вы бы прожили иначе — и что сделали бы по-другому?"}
  ],
  "block_c": {
    "per_channel": 3,
    "question": "Насколько это про вас в последний месяц?"
  }
}
</script>
<script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('test-data').textContent);
var BRIDGE_URL=""; /* URL веб-приложения Apps Script — заполнить после деплоя моста */
var HOTLINE="8-800-2000-122";
var KEY='full_map_test_v1';
var CH=Object.keys(D.channels);
var RED=/бессмысленн|не хочу жить|суицид|самоубийств|покончить|вскры(?:ть|ла)|порез|ненавижу себя|не вижу смысла|хочу умереть|ушл[аяо] из жизни/i;

function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

var S=load()||{step:'intro',ai:0,bi:0,ci:0,a:{},b:{},c:{},cRaw:{},cPool:null,red:false};

function progress(){
  var done=Object.keys(S.a).length+Object.keys(S.b).length+Object.keys(S.c).length;
  return Math.round(100*done/48);
}
function bar(){
  var p=progress();
  return '<div class="bar"><i style="width:'+p+'%"></i></div><div class="meta">Прогресс: '+p+'%</div>';
}

function redScreen(){
  app.innerHTML='<div class="card redscreen">'+
    '<h1>Здесь важно остановиться</h1>'+
    '<p>Похоже, вам сейчас по-настоящему тяжело. Этот тест — не место, где это нужно тащить в одиночку.</p>'+
    '<p style="margin-top:12px">Поговорите со специалистом. А если нужен живой голос прямо сейчас — '+
    '<b>'+HOTLINE+'</b> — бесплатная круглосуточная линия.</p>'+
    '<p class="note">Тест останавливается. Это не провал и не ошибка.</p></div>';
}

function intro(){
  app.innerHTML='<h1>Полная карта состояний</h1>'+
    '<p class="muted">24 ситуации, 6 открытых вопросов, 24 слайдера. Займёт 20–25 минут. '+
    'Ответы сохраняются автоматически — можно продолжить позже.</p>'+
    '<div class="card"><p>Один вопрос — один выбор, «правильных» ответов нет. '+
    'Отвечайте, как оно на самом деле в последний месяц.</p>'+
    '<button class="btn" id="go">Начать</button>'+
    (progress()>0?'<button class="btn sec" id="cont">Продолжить</button>':'')+
    '<p class="note">Данные хранятся только на вашем устройстве.</p></div>';
  document.getElementById('go').onclick=function(){S.step='a';save();render()};
  var c=document.getElementById('cont');if(c)c.onclick=function(){render()};
}

function screenA(){
  var q=D.block_a[S.ai];
  var opts=shuffle(q.options);
  var html='<h1>Вопрос '+(S.ai+1)+' из 24</h1>'+bar()+
    '<div class="card"><p>'+esc(q.text)+'</p>';
  opts.forEach(function(o,i){
    html+='<button class="opt" data-i="'+i+'">'+esc(o.t)+'</button>';
  });
  html+='</div>';
  app.innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(btn){
    btn.onclick=function(){
      var o=opts[Number(btn.getAttribute('data-i'))];
      S.a[q.id]=o.ch;S.ai++;save();
      if(S.ai>=24){S.step='b'}render();
    };
  });
}

function screenB(){
  var q=D.block_b[S.bi];
  var html='<h1>Открытый вопрос '+(S.bi+1)+' из 6</h1>'+bar()+
    '<div class="card"><p>'+esc(q.text)+'</p>'+
    '<textarea id="bo">'+esc(S.b[q.id]||'')+'</textarea>'+
    '<p class="note" id="cnt"></p>'+
    '<p class="note warn" id="err" style="display:none">Нужно хотя бы 30 символов.</p>'+
    '<button class="btn" id="next">Дальше</button></div>';
  app.innerHTML=html;
  var ta=document.getElementById('bo'),cnt=document.getElementById('cnt'),err=document.getElementById('err');
  function upd(){var n=ta.value.trim().length;cnt.textContent='Символов: '+n+' (минимум 30)';}
  ta.oninput=upd;upd();
  document.getElementById('next').onclick=function(){
    var t=ta.value.trim();
    if(t.length<30){err.style.display='';return}
    if(RED.test(t)){S.red=true;save();render();return}
    S.b[q.id]=t;S.bi++;save();
    if(S.bi>=6){S.step='c'}render();
  };
}

function screenC(){
  if(!S.cPool){
    S.cPool={};
    CH.forEach(function(ch){S.cPool[ch]=shuffle([0,1,2,3,4,5]).slice(0,3)});
    save();
  }
  var ch=CH[S.ci];
  var idx=S.cPool[ch];
  var vals=S.cRaw[ch]||[5,5,5];
  var html='<h1>Слайдеры: '+(S.ci+1)+' из 8 каналов</h1>'+bar()+
    '<div class="card"><p>'+esc(D.block_c.question)+'</p>';
  idx.forEach(function(k,i){
    html+='<div class="slider"><label>'+esc(D.channels[ch].clamp[k])+'</label>'+
      '<input type="range" min="1" max="10" step="1" value="'+vals[i]+'" data-i="'+i+'">'+
      '<div class="note sig" data-i="'+i+'" style="display:none">Сильный сигнал — значение 9–10.</div></div>';
  });
  html+='<button class="btn" id="next">Дальше</button></div>';
  app.innerHTML=html;
  Array.prototype.forEach.call(document.querySelectorAll('input[type=range]'),function(r){
    r.oninput=function(){
      var n=Number(r.getAttribute('data-i'));
      document.querySelectorAll('.sig')[n].style.display=r.value>=9?'':'none';
    };
  });
  document.getElementById('next').onclick=function(){
    var vs=Array.prototype.map.call(document.querySelectorAll('input[type=range]'),function(r){return Number(r.value)});
    S.cRaw[ch]=vs;
    S.c[ch]=Math.round(10*vs.reduce(function(a,b){return a+b},0)/3)/10;
    S.ci++;save();
    if(S.ci>=8){S.step='result'}render();
  };
}

function computeScores(){
  var sc={};CH.forEach(function(c){sc[c]=0});
  Object.keys(S.a).forEach(function(qid){sc[S.a[qid]]++});
  var arr=CH.slice().sort(function(x,y){return sc[y]-sc[x]});
  return {sc:sc,sorted:arr,tie:sc[arr[0]]===sc[arr[1]]};
}
function color(v){return v<=3?'#7fae7f':(v<=7?'#d9b23f':'#c05252')}

function result(){
  var r=computeScores();
  var lead=r.sorted[0],sup=r.sorted[1];
  var html='<h1>Предварительная карта</h1>';
  if(r.tie){
    html+='<div class="card"><p class="warn">Ведущий и опорный набрали поровну — '+
      'это честная ничья. Оба канала показаны как равные; уточнение даёт полная диагностика.</p></div>';
  }
  html+='<div class="card"><p><b>Ведущий канал: '+esc(lead)+'</b> — '+r.sc[lead]+' из 12</p>'+
    (r.tie?'<p><b>Опорный канал: '+esc(sup)+'</b> — '+r.sc[sup]+' (вровень с ведущим)</p>'
          :'<p class="muted">Опорный канал: '+esc(sup)+' — '+r.sc[sup]+'</p>')+
    '<p class="note">Уровень зажима по слайдерам: '+S.c[lead]+' из 10.</p></div>';
  html+='<div class="card"><p><b>Тепловая карта</b></p>';
  CH.forEach(function(ch){
    var v=S.c[ch]||0;
    html+='<div class="hm"><span class="name">'+esc(ch)+'</span>'+
      '<span class="fill"><i style="width:'+(v*10)+'%;background:'+color(v)+'"></i></span>'+
      '<span class="val">'+v+'</span></div>';
  });
  html+='</div>';
  html+='<div class="card">'+
    '<button class="btn" id="send">Отправить на разбор</button>'+
    '<button class="btn sec" id="dl">Скачать ответы (JSON)</button>'+
    '<button class="btn sec" id="dlbank">Скачать банк (JSON)</button>'+
    '<p class="note" id="msg"></p></div>';
  app.innerHTML=html;

  var quotes={};
  D.block_a.forEach(function(q){
    if(q.key_for_quote&&S.a[q.id]){
      var o=q.options.filter(function(x){return x.ch===S.a[q.id]})[0];
      quotes[q.id]=o.t;
    }
  });
  var payload={type:'full_map',ts:new Date().toISOString(),
    leading:lead,support:sup,tie:r.tie,
    clamp_level:S.c[lead],
    heatmap:S.c,scores:r.sc,
    quotes:quotes,open_answers:S.b};

  document.getElementById('dl').onclick=function(){
    var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='test_answers.json';a.click();
  };
  document.getElementById('dlbank').onclick=function(){
    var blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='test_content.json';a.click();
  };
  document.getElementById('send').onclick=function(){
    var msg=document.getElementById('msg');
    if(!BRIDGE_URL){
      msg.textContent='Мост не подключён: заполните BRIDGE_URL в коде. Ответы можно скачать кнопкой выше.';
      return;
    }
    msg.textContent='Отправляю…';
    fetch(BRIDGE_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(payload)})
      .then(function(res){return res.json()})
      .then(function(j){
        if(j&&j.status==='done'&&j.result){msg.textContent='Разбор получен (короткая версия — в консоли).';console.log(j.result)}
        else{msg.textContent='Заявка принята. Разбор появится в таблице — ZennoPoster заберёт его на ближайшем тикере.'}
      })
      .catch(function(){msg.textContent='Не удалось отправить. Проверьте BRIDGE_URL и доступ приложения.'});
  };
}

function render(){
  if(S.red)return redScreen();
  switch(S.step){
    case 'intro':return intro();
    case 'a':return S.ai<24?screenA():intro();
    case 'b':return S.bi<6?screenB():intro();
    case 'c':return S.ci<8?screenC():intro();
    case 'result':return result();
    default:S.step='intro';return intro();
  }
}
var app=document.getElementById('app');
render();
})();
</script>
</body>
</html>
